name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      COVERAGE_MIN: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present
      # Thresholds live in jest/vitest config (see references/coverage.md); the run fails below them.
      - name: Test with coverage gate
        run: npm test -- --coverage
