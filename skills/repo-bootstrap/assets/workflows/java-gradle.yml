name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      COVERAGE_MIN: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      # jacocoTestCoverageVerification is wired into `check` (see references/coverage.md).
      - name: Build, test and coverage gate
        run: ./gradlew check --no-daemon
